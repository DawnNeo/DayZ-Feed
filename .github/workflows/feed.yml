# Place this file at .github/workflows/feed.yml in the feed repository.
name: Publish DayZ server feed
on:
  schedule:
    - cron: "*/20 * * * *"   # GitHub treats this as "when it can" - in practice every few hours
  workflow_dispatch: {}       # manual run button
concurrency:
  group: feed
  cancel-in-progress: false


permissions:
  contents: write   # pushes the population history to the "data" branch
  pages: write      # publishes servers.json to GitHub Pages
  id-token: write   # required by actions/deploy-pages


jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # deploy-pages publishes into this environment; it is what the Pages URL hangs off.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Population history lives on the force-pushed single-commit "data" branch; check the
      # prior state out so this run can append to it. First run: branch doesn't exist yet.
      - name: Fetch history state
        run: |
          git fetch origin data 2>/dev/null && git worktree add history origin/data || mkdir -p history
      - name: Generate feed
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          dotnet run --project dayz-feed-repo/feedgen -c Release
      # The feed is published straight to GitHub Pages as a deployment - NOT committed to main.
      # Committing a ~6 MB file every run grew the repository by roughly 0.5 MB per run (272 MB
      # in three months), and more frequent runs would have hit GitHub's size limits within
      # weeks. The URL is unchanged: https://dawnneo.github.io/DayZ-Feed/servers.json
      # (Requires Settings > Pages > Source: "GitHub Actions".)
      - name: Stage site
        run: |
          mkdir -p site
          mv servers.json site/servers.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # The feed goes out FIRST, so a problem with the history push can never hold back the
      # server list everyone downloads.
      - name: Publish feed
        id: deployment
        uses: actions/deploy-pages@v5
      # The data branch is REPLACED each run (one commit, no accumulation) so the repository
      # never bloats no matter how long the recorder runs. A failure here is reported but does
      # not fail the run - the feed is already published.
      - name: Publish history
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd history-out
          git init -q -b data
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A
          git commit -qm "population history"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
